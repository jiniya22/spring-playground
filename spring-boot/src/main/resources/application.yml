spring:
  application:
    admin:
      enabled: true
    name: spring-boot
  profiles:
    active: local

  devtools:
    restart:
      enabled: true
      log-condition-evaluation-delta: false
      additional-exclude: ttt/**,**/Ttt*.class
      trigger-file: .reloadtrigger
    livereload:
      enabled: false

  main:
    log-startup-info: false
    register-shutdown-hook: true
    lazy-initialization: true

  mvc:
    log-request-details: true
    log-resolved-exception: true
    static-path-pattern: /static/**

  thymeleaf:
    cache: false

  web:
    resources:
      static-locations:
        - classpath:/static/
      cache:
        period: 0

  jmx:
    enabled: true

management:
  endpoint:
    env:
      show-values: always
  endpoints:
    web:
      exposure:
        include: env

logging:
  level:
    root: info
    web: debug
    org.springframework:
      boot.autoconfigure: info
      web: debug
